# Build, pruebas y lint de los controles de esta remediación.
# El eslint de todo el repositorio sigue pendiente: el árbol anterior no pasa Prettier.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npm run db:generate

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: E2E de identidad y salud
        run: npm run test:e2e

      - name: Lint de controles de seguridad
        run: npx eslint src/common/security-policy.ts src/common/security-policy.spec.ts src/common/wompi-signature.ts src/common/wompi-signature.spec.ts src/common/shop-access-token.ts src/common/shop-access-token.spec.ts src/tenant/tenant.guard.ts src/tenant/tenant.guard.spec.ts src/auth/auth-cookie.ts src/auth/auth-session.service.ts src/audit/audit.service.ts src/app.active-modules.spec.ts --max-warnings 0
